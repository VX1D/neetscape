                viewJobClientSideModel: {"jobInfoWrapperModel":{"jobInfoModel":{"jobMetadataHeaderModel":{"jobType":""},"sanitizedJobDescription":"\u003Cdiv>\n \u003Cp>\u003Cb>Kogo szukamy?\u003C\u002Fb>\u003C\u002Fp>\n \u003Cp>Do naszego zespołu poszukujemy osoby, która wzmocni obszar zarządzania należnościami, wspierając terminowy obieg płatności i bieżącą współpracę z klientami.\u003C\u002Fp>\n \u003Cp>\u003Cb> Co będzie należało do Twoich zadań?\u003C\u002Fb>\u003C\u002Fp>\n \u003Cul>\n  \u003Cli>\n   \u003Cp>monitorowanie należności i terminowości płatności,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>kontakt z klientami w sprawie zaległości i prowadzenie działań przypominających,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>analiza przeterminowanych należności i podejmowanie działań windykacyjnych,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>uzgadnianie sald i wyjaśnianie rozbieżności,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>przygotowywanie raportów i analiz dotyczących należności,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>wsparcie w ocenie ryzyka kredytowego oraz kontroli limitów kupieckich,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>dbanie o zgodność działań z procedurami firmy.\u003C\u002Fp>\u003C\u002Fli>\n \u003C\u002Ful>\n \u003Cp>\u003Cb> Jakich kompetencji i umiejętności oczekujemy?\u003C\u002Fb>\u003C\u002Fp>\n \u003Cul>\n  \u003Cli>\n   \u003Cp>praktycznej znajomości programu SAP,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>bardzo dobrej znajomości programu Excel,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>podstawowej wiedzy z zakresu księgowości,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>samodzielności, dokładności, terminowości, proaktywnej postawy i nastawienia na współpracę,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>umiejętności pracy pod presją czasu, gotowości do nauki i rozwoju,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>znajomości języka angielskiego w stopniu umożliwiającym swobodną komunikację.\u003C\u002Fp>\u003C\u002Fli>\n \u003C\u002Ful>\n \u003Cp>\u003Cb> Co oferujemy?\u003C\u002Fb>\u003C\u002Fp>\n \u003Cul>\n  \u003Cli>\n   \u003Cp>możliwości rozwoju w obszarze finansów,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>realny wpływ na sprawność procesów finansowych firmy,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>pracę w środowisku międzynarodowym i kulturę, w której dbamy o najwyższe standardy bezpieczeństwa,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>hybrydowy model pracy 3\u002F2,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>prywatną opiekę medyczną Medicover,\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>kartę Multisport - dla Ciebie i Twoich bliskich.\u003C\u002Fp>\u003C\u002Fli>\n \u003C\u002Ful>\n \u003Cp>\u003C\u002Fp>\n \u003Cp>Pragniemy poinformować, iż administratorem przetwarzanych w ramach procesu rekrutacji danych osobowych jest Knauf Service Sp. z o.o. w Jaworznie. Ponadto, informujemy, że:\u003C\u002Fp>\n \u003Cul>\n  \u003Cli>\n   \u003Cp>Pani\u002FPana dane osobowe będą przetwarzane przez Knauf Service Sp. z o.o. w Jaworznie w celu przeprowadzenia i rozstrzygnięcia procesu rekrutacji, zgodnie z art. 6 ust. 1 lit. b Rozporządzenia Parlamentu Europejskiego i Rady \u002FUE\u002F 2016\u002F679 z dnia 27.04.2016r. w sprawie ochrony osób fizycznych w związku z przetwarzaniem danych osobowych i w sprawie swobodnego przepływu takich danych oraz uchylenia dyrektywy 95\u002F46\u002FWE \u002FRODO\u002F.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Dane osobowe będą przetwarzane w celu przeprowadzenia obecnego postępowania rekrutacyjnego, a w przypadku wyrażenia zgody, także w następnych postępowaniach rekrutacyjnych \u002Fzgodnie z art. 6 ust. 1 lit. a RODO\u002F.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Pani\u002FPana dane osobowe będą przechowywane przez czas niezbędny do rozstrzygnięcia procesu rekrutacji. W przypadku wyrażenia zgody na udział w następnych postępowaniach rekrutacyjnych dane będą przechowywane przez okres pięciu lat.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Przysługuje Pani\u002FPanu prawo żądania dostępu do danych osobowych dotyczących Pani\u002FPana osoby, żądania ich sprostowania, usunięcia lub ograniczenia przetwarzania.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Przysługuje Pani\u002FPanu prawo do cofnięcia wyrażonej zgody w dowolnym momencie. Powyższe nie wpływa na zgodność z prawem przetwarzania, którego dokonano na podstawie wyrażonej przez Panią\u002FPana zgody przed jej cofnięciem.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Przysługuje Pani\u002FPanu prawo do złożenia skargi do organu nadzorczego – Prezesa Urzędu Ochrony Danych Osobowych.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Podanie przez Państwa danych osobowych w zakresie wynikającym z art. 221 Kodeksu pracy jest niezbędne do udziału w procesie rekrutacji. Podanie przez Państwa innych danych jest dobrowolne.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Decyzje dotyczące przeprowadzenia oraz rozstrzygnięcia procesu rekrutacji nie będą podejmowane w sposób zautomatyzowany.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Zastrzegamy sobie możliwość kontaktu tylko z wybranymi Kandydatami.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Dane osobowe mogą zostać udostępnione podmiotom działającym na zlecenie administratora danych, tj. zaangażowanym w proces rekrutacji na rzecz jest Knauf Service Sp. z o.o. w Jaworznie.\u003C\u002Fp>\u003C\u002Fli>\n  \u003Cli>\n   \u003Cp>Więcej informacji może Pani\u002FPan uzyskać drogą elektroniczną ochronadanych@knauf.com.\u003C\u002Fp>\u003C\u002Fli>\n \u003C\u002Ful>\n\u003C\u002Fdiv>"}}},
