<html><script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","datePosted":"2026-11-12T12:30:06.1428502Z","description":"\u003cp>W ITLT pomagamy naszym zaprzyjaźnionym firmom przekształcać ambitne pomysły w cyfrową rzeczywistość. Z nastawieniem na wyzwania, ciekawość technologii i zwinność współtworzymy wyjątkowe rozwiązania IT i zapewniamy doświadczone osoby eksperckie, które pomagają przyspieszać cyfrową transformację.\u003cbr />\u003cbr />Dołącz do grona ekspertek i ekspertów, którzy będą wspierać organizacje w podnoszeniu poziomu cyberbezpieczeństwa i dostosowywaniu środowisk IT do wymagań NIS2 oraz polskiej ustawy o KSC. Poszukujemy do współpracy osób, które łączą wiedzę z zakresu bezpieczeństwa IT, zarządzania ryzykiem i bezpieczeństwa informacji z praktycznym doświadczeniem w realizacji projektów.\u003cbr />\u003cbr />Zakres zadań:\u003c/p>\u003cul>\u003cli>\u003cp>Przeprowadzanie audytów bezpieczeństwa IT oraz analiz typu Gap Assessment, obejmujących ocenę aktualnego poziomu zabezpieczeń i identyfikację obszarów wymagających poprawy.\u003c/p>\u003c/li>\u003cli>\u003cp>Analiza ryzyka oraz ocena zgodności środowisk IT, procesów i procedur z wymaganiami bezpieczeństwa, w tym NIS2, KSC i ISO/IEC 27001.\u003c/p>\u003c/li>\u003cli>\u003cp>Współtworzenie i rozwijanie Systemów Zarządzania Bezpieczeństwem Informacji (SZBI), polityk bezpieczeństwa, procedur i standardów.\u003c/p>\u003c/li>\u003cli>\u003cp>Przygotowywanie rekomendacji technicznych i organizacyjnych oraz planów działań naprawczych (roadmap) w obszarze cyberbezpieczeństwa.\u003c/p>\u003c/li>\u003cli>\u003cp>Wsparcie organizacji w projektowaniu i doskonaleniu procesów zarządzania incydentami bezpieczeństwa, ciągłością działania oraz bezpieczeństwem łańcucha dostaw.\u003c/p>\u003c/li>\u003cli>\u003cp>Współpraca z zespołami IT, Security, Infrastructure i przedstawicielami biznesu przy identyfikacji wymagań oraz wdrażaniu odpowiednich mechanizmów bezpieczeństwa.\u003c/p>\u003c/li>\u003cli>\u003cp>Prowadzenie warsztatów, konsultacji i działań doradczych dla klientów w zakresie bezpieczeństwa informacji i cyberbezpieczeństwa.\u003c/p>\u003c/li>\u003cli>\u003cp>Wsparcie organizacji w przygotowaniu do audytów oraz weryfikacji spełnienia wymagań regulacyjnych i standardów bezpieczeństwa.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Oczekiwania:\u003c/p>\u003cul>\u003cli>\u003cp>Praktyczne doświadczenie w obszarze IT Security, Information Security, Cybersecurity, GRC lub bezpieczeństwa informacji.\u003c/p>\u003c/li>\u003cli>\u003cp>Doświadczenie w przeprowadzaniu audytów bezpieczeństwa, analizie ryzyka, ocenie luk bezpieczeństwa lub wdrażaniu systemów zarządzania bezpieczeństwem informacji.\u003c/p>\u003c/li>\u003cli>\u003cp>Znajomość standardu ISO/IEC 27001 oraz zagadnień związanych z zarządzaniem bezpieczeństwem informacji.\u003c/p>\u003c/li>\u003cli>\u003cp>Orientacja w wymaganiach NIS2 i/lub polskiej ustawy o KSC albo gotowość do wykorzystania dotychczasowej wiedzy z obszaru bezpieczeństwa IT w projektach związanych z tymi regulacjami.\u003c/p>\u003c/li>\u003cli>\u003cp>Umiejętność przekładania wymagań bezpieczeństwa na konkretne rekomendacje, działania i rozwiązania możliwe do wdrożenia w organizacji.\u003c/p>\u003c/li>\u003cli>\u003cp>Umiejętność współpracy z zespołami technicznymi oraz biznesowymi, a także swobodnego komunikowania zagadnień związanych z bezpieczeństwem IT.\u003c/p>\u003c/li>\u003cli>\u003cp>Samodzielność w realizacji powierzonych zadań i odpowiedzialność za rekomendowane rozwiązania.\u003c/p>\u003cp>Dodatkowym atutem będzie:\u003c/p>\u003c/li>\u003cli>\u003cp>Doświadczenie w projektach związanych z NIS2, KSC lub wdrażaniem wymagań regulacyjnych w obszarze cyberbezpieczeństwa.\u003c/p>\u003c/li>\u003cli>\u003cp>Certyfikaty ISO/IEC 27001 Lead Auditor lub Lead Implementer.\u003c/p>\u003c/li>\u003cli>\u003cp>Znajomość dodatkowych standardów i metodyk, np. ISO 27005, ISO 22301, NIST lub CIS Controls.\u003c/p>\u003c/li>\u003cli>\u003cp>Doświadczenie w roli CISO, Security Managera, Information Security Consultant lub podobnej.\u003c/p>\u003c/li>\u003cli>\u003cp>Doświadczenie w organizacjach z sektorów regulowanych, np. finansowego, energetycznego, telekomunikacyjnego lub produkcyjnego.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Model współpracy:\u003c/p>\u003cul>\u003cli>\u003cp>Współpraca projektowa lub długofalowa w modelu B2B.\u003c/p>\u003c/li>\u003cli>\u003cp>Możliwość angażowania się w projekty w różnym wymiarze godzinowym – od konsultacji i audytów po kompleksowe wsparcie wdrożeniowe.\u003c/p>\u003c/li>\u003cli>\u003cp>Elastyczne dopasowanie zakresu współpracy do dostępności i specjalizacji eksperta lub ekspertki.\u003c/p>\u003c/li>\u003cli>\u003cp>Projekty realizowane dla organizacji z różnych sektorów rynku.\u003c/p>\u003c/li>\u003c/ul>","title":"Konsultant / Konsultantka ds. IT Security, NIS2 i bezpieczeństwa informacji","validThrough":"2027-02-02T12:21:29.798Z","employmentType":["CONTRACTOR"],"jobLocationType":"TELECOMMUTE","hiringOrganization":{"@type":"Organization","name":"ITLT","logo":"https://public.justjoin.it/companies/logos/original/998af4aa87ea6f5f823167ef3daec59e2ab1e07f.jpg?1517407659"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"PL","addressLocality":"Warszawa","streetAddress":"Taśmowa 7C"}},"applicantLocationRequirements":{"@type":"Country","name":"Poland"}}</script></html>
